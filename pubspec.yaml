name: serial_lab
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Serial Communication
  flutter_blue_plus: ^2.2.1  # BLE용 (HC-06도 BLE 지원하는 경우 많음)
  flutter_bluetooth_serial_plus: ^0.5.1  # Classic Bluetooth용 (HC-06)
  usb_serial: ^0.5.2
  
  # Network Communication
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  
  # Charts
  fl_chart: ^1.2.0
  vector_math: ^2.2.0
  
  # JSON Serialization
  json_annotation: ^4.9.0
  
  # Utilities
  permission_handler: ^12.0.1
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  device_info_plus: ^11.5.0
  logger: ^2.5.0
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Code Editor & Compilation
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0  # flutter_code_editor 테마 사용을 위한 명시적 선언
  highlight: ^0.7.0
  process_run: ^1.2.0
  path: ^1.9.0
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  generate: true
  uses-material-design: true
